name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kroki-mermaidx:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -eux
          docker run -d --name mermaidx-smoke -p 8006:8006 kroki-mermaidx:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8006/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8006/health | grep -q '"status":"ok"'
          curl -fsS -X POST http://127.0.0.1:8006/mermaidx/svg \
            -H 'Content-Type: text/plain' --data-binary 'flowchart LR; A-->B' | grep -q '<svg'
          curl -fsS -X POST http://127.0.0.1:8006/mermaidx/png \
            -H 'Content-Type: text/plain' --data-binary 'flowchart LR; A-->B' -o /tmp/diagram.png
          head -c 8 /tmp/diagram.png | grep -q 'PNG'
          docker logs mermaidx-smoke
          docker rm -f mermaidx-smoke

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
          labels: |
            org.opencontainers.image.title=kroki-mermaidx
            org.opencontainers.image.description=Browserless Mermaid companion service for Kroki
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
